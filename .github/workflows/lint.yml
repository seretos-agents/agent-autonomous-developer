name: lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Validate skill + agent frontmatter
        run: |
          python3 - <<'EOF'
          import re, sys, glob
          ok = True
          targets = sorted(glob.glob("skills/*/SKILL.md")) + sorted(glob.glob("agents/*.md"))
          if not targets:
              print("::error::no skills/*/SKILL.md or agents/*.md found"); sys.exit(1)
          for path in targets:
              text = open(path, encoding="utf-8").read()
              m = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
              if not m:
                  print(f"::error::{path} missing YAML frontmatter"); ok = False; continue
              fm = m.group(1)
              if "name:" not in fm or "description:" not in fm:
                  print(f"::error::{path} frontmatter missing 'name' or 'description'"); ok = False; continue
              print(f"{path}: OK")
          sys.exit(0 if ok else 1)
          EOF

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A missing bash/jq must fail this job, not silently skip the tests
      # that need them (tests/test_release_scripts.py's shared harness).
      ADEV_REQUIRE_SHELL_TOOLING: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Run pytest
        run: python -m pytest -q

  test-windows:
    # ticket #107: release.yml's own tests (tests/test_release_scripts.py)
    # execute real bash under Git-for-Windows -- the one OS-specific
    # assumption this repo's test suite makes. Targeted at that one file
    # rather than the full suite: gating this PR on 100+ tests that never
    # ran on Windows would be a full-suite OS matrix this ticket explicitly
    # does not add.
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      ADEV_REQUIRE_SHELL_TOOLING: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Run pytest (shell-executing tests only)
        run: python -m pytest -q tests/test_release_scripts.py tests/test_ci_wait_resolution.py tests/test_developer_commit.py tests/test_live_kill_test.py
